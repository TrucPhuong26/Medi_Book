name: medibook_new
description: Medical Booking App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.1.0
  http: ^1.2.0 # Thêm dòng này nếu chưa có
  flutter_localizations:
    sdk: flutter
  flutter_local_notifications: ^17.0.0 # Hoặc phiên bản mới nhất
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1
  intl: ^0.20.2


  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path: ^1.9.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  firebase_core: ^4.8.0
  cloud_firestore: ^6.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/splash_loading.json
    - assets/animations/empty_appointment.json